<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Hacker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .dashboard {
            position: relative;
            z-index: 2;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px #00ff66, inset 0 0 20px #00ff66;
            padding: 30px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.85);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff66;
        }
        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-shadow: 0 0 5px #00ff66;
            box-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
        }
        .btn:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 15px #00ff66;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="dashboard">
        <h1>[ PAINEL HACKER ]</h1>
        <div class="menu-options">
            <button class="btn" onclick="alert('Como aprender programação: Comece estudando HTML, CSS e JavaScript!')">Como aprender programação</button>
            <button class="btn" onclick="alert('Opção 2 selecionada: Sistema seguro.')">Opção 2</button>
            <button class="btn" onclick="alert('Opção 3 selecionada: Acesso liberado.')">Opção 3</button>
            <button class="btn" onclick="alert('Opção 4 selecionada: Terminal pronto.')">Opção 4</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);
    </script>
</body>
</html>
